name: Withdraw superseded modern releases

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/withdraw-modern-releases.yml

permissions:
  contents: write

jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Remove releases and tags newer than 2.0.2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v2.0.2 --repo "$GH_REPO" >/dev/null
          for tag in v2.1.0 v2.1.1 v2.2.0; do
            if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes
            else
              gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
            fi
          done
