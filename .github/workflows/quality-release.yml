name: Quality and portable release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AHK_VERSION: "2.0.28"
  AHK2EXE_VERSION: "1.1.37.02a2"

jobs:
  quality:
    name: Validate and build portable ZIP
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate project contract
        run: python scripts/validate_project.py

      - name: Download official AutoHotkey tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item build/tools -ItemType Directory -Force | Out-Null
          Invoke-WebRequest "https://github.com/AutoHotkey/AutoHotkey/releases/download/v${env:AHK_VERSION}/AutoHotkey_${env:AHK_VERSION}.zip" -OutFile build/tools/autohotkey.zip
          Invoke-WebRequest "https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe${env:AHK2EXE_VERSION}/Ahk2Exe${env:AHK2EXE_VERSION}.zip" -OutFile build/tools/ahk2exe.zip
          Expand-Archive build/tools/autohotkey.zip build/tools/autohotkey
          Expand-Archive build/tools/ahk2exe.zip build/tools/ahk2exe

      - name: Test hotkey group cycling
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testProcess = Start-Process `
            -FilePath "$PWD/build/tools/autohotkey/AutoHotkey64.exe" `
            -ArgumentList "/ErrorStdOut", "`"$PWD/tests/group-cycle.ahk`"" `
            -Wait `
            -PassThru `
            -NoNewWindow
          if ($testProcess.ExitCode -ne 0) { throw "Hotkey group regression tests failed with exit code $($testProcess.ExitCode)" }

      - name: Test hotkey capture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testProcess = Start-Process `
            -FilePath "$PWD/build/tools/autohotkey/AutoHotkey64.exe" `
            -ArgumentList "/ErrorStdOut", "`"$PWD/tests/hotkey-capture.ahk`"" `
            -Wait `
            -PassThru `
            -NoNewWindow
          if ($testProcess.ExitCode -ne 0) { throw "Hotkey capture regression tests failed with exit code $($testProcess.ExitCode)" }

      - name: Compile and package portable version
        shell: pwsh
        run: |
          ./scripts/build-portable.ps1 `
            -AutoHotkeyRoot "$PWD/build/tools/autohotkey" `
            -Ahk2ExePath "$PWD/build/tools/ahk2exe/Ahk2Exe.exe"

      - name: Verify portable ZIP contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem dist/*-portable.zip | Select-Object -First 1
          if (-not $zip) { throw "Portable ZIP is missing" }
          $checkRoot = Join-Path $env:RUNNER_TEMP "portable-check"
          Expand-Archive $zip.FullName $checkRoot
          $required = @(
            "EVE-X-Preview-Reloaded.exe",
            "locales/de.json",
            "locales/en.json",
            "LICENSE",
            "PORTABLE.md"
          )
          foreach ($relativePath in $required) {
            $match = Get-ChildItem $checkRoot -Recurse -File | Where-Object {
              $_.FullName.Replace("\", "/").EndsWith($relativePath)
            }
            if (-not $match) { throw "Portable ZIP is missing $relativePath" }
          }

  release:
    name: Publish portable release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate project contract
        run: python scripts/validate_project.py

      - name: Download official AutoHotkey tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item build/tools -ItemType Directory -Force | Out-Null
          Invoke-WebRequest "https://github.com/AutoHotkey/AutoHotkey/releases/download/v${env:AHK_VERSION}/AutoHotkey_${env:AHK_VERSION}.zip" -OutFile build/tools/autohotkey.zip
          Invoke-WebRequest "https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe${env:AHK2EXE_VERSION}/Ahk2Exe${env:AHK2EXE_VERSION}.zip" -OutFile build/tools/ahk2exe.zip
          Expand-Archive build/tools/autohotkey.zip build/tools/autohotkey
          Expand-Archive build/tools/ahk2exe.zip build/tools/ahk2exe

      - name: Build portable ZIP
        shell: pwsh
        run: |
          ./scripts/build-portable.ps1 `
            -AutoHotkeyRoot "$PWD/build/tools/autohotkey" `
            -Ahk2ExePath "$PWD/build/tools/ahk2exe/Ahk2Exe.exe"

      - name: Publish GitHub release if version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; nothing to publish."
            exit 0
          }
          $asset = (Get-ChildItem dist/*-portable.zip | Select-Object -First 1).FullName
          $arguments = @(
            "release", "create", $tag, $asset,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", "EVE-X-Preview Reloaded $version",
            "--notes-file", "RELEASE_NOTES.md"
          )
          if ($version.Contains("-")) { $arguments += "--prerelease" }
          & gh @arguments
