name: Remove withdrawn design branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-withdrawn-design-branch.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete withdrawn design branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/redesign/exact-modern-mockup"
